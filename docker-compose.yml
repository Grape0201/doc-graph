services:
  opensearch:
    build:
      context: .
      dockerfile: docker/opensearch/Dockerfile
    container_name: opensearch
    environment:
      - discovery.type=single-node
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=ComplexPassword123!
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    networks:
      - doc-graph-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    container_name: neo4j
    environment:
      - NEO4J_AUTH=none
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
    networks:
      - doc-graph-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7474/"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "8000:8000"
    environment:
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_PORT=9200
      - NEO4J_URI=bolt://neo4j:7687
    depends_on:
      opensearch:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks:
      - doc-graph-net
    volumes:
      - ./backend:/app/backend

networks:
  doc-graph-net:
    driver: bridge

volumes:
  opensearch-data:
  neo4j-data:
